name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ordenar archivos en carpetas
        run: |
          mkdir -p app/src/main/java/com/gabriel/pantallanegra
          mv AndroidManifest.xml app/src/main/
          mv *.java app/src/main/java/com/gabriel/pantallanegra/
          mv app.build.gradle.kts app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: PantallaNegra-apk
          path: app/build/outputs/apk/release/*.apk
